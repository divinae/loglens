# CI for LogLens. gitlab.com shared runners are Linux, so .deb + portable build here;
# macOS (.dmg) and Windows (.msi) are built on their native platforms (see RELEASE.md) —
# jpackage only targets the current OS.
#
# Gradle itself must run on JDK 21 (a newer system JDK breaks the build). The image below
# ships JDK 21; the Kotlin/Compose toolchain then auto-provisions JetBrains Runtime 21 via the
# foojay resolver for compile/run/package.

image: eclipse-temurin:21-jdk

variables:
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .gradle/caches
    - .gradle/wrapper

stages:
  - verify
  - release

verify:
  stage: verify
  script:
    # createDistributable smoke-tests jlink/jpackage with the JBR 25 toolchain on every Linux
    # build; the resulting app image is only uploaded from the tagged release job.
    - ./gradlew --no-daemon :composeApp:jvmTest detekt :composeApp:createDistributable
  artifacts:
    when: always
    reports:
      junit: composeApp/build/test-results/jvmTest/*.xml
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# Build the Linux .deb + a portable app image on a tag like v1.0.0, then upload both to the
# generic Package Registry so the release job can attach them as release assets.
# .deb packaging needs dpkg + fakeroot on the runner.
release-linux:
  stage: release
  before_script:
    - apt-get update -qq && apt-get install -y -qq fakeroot dpkg curl
  script:
    - ./gradlew --no-daemon -PappVersion=${CI_COMMIT_TAG#v} :composeApp:packageDeb :composeApp:createDistributable
    - mkdir -p dist
    - cp composeApp/build/compose/binaries/main/deb/*.deb dist/ || true
    - tar -C composeApp/build/compose/binaries/main/app -czf dist/loglens-${CI_COMMIT_TAG}-linux-x64.tar.gz loglens
    # Upload everything in dist/ to the generic Package Registry under loglens/<version>/.
    - |
      VERSION=${CI_COMMIT_TAG#v}
      for f in dist/*; do
        name=$(basename "$f")
        curl --fail --silent --show-error --header "JOB-TOKEN: $CI_JOB_TOKEN" \
          --upload-file "$f" \
          "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/loglens/$VERSION/$name"
      done
  artifacts:
    paths:
      - dist/
    expire_in: never
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/'

# Create the GitLab Release for the tag, with asset links pointing at the Package Registry
# files uploaded by release-linux. macOS/Windows artifacts are uploaded + linked manually
# (see RELEASE.md) until those builds are automated.
release-create:
  stage: release
  needs: ["release-linux"]
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  script:
    - |
      VERSION=${CI_COMMIT_TAG#v}
      PKG_URL="$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/loglens/$VERSION"
      TARBALL="loglens-${CI_COMMIT_TAG}-linux-x64.tar.gz"
      TARBALL_LINK="{\"name\":\"$TARBALL\",\"url\":\"$PKG_URL/$TARBALL\",\"link_type\":\"package\"}"
      DEB=$(basename dist/*.deb 2>/dev/null || true)
      if [ -n "$DEB" ] && [ "$DEB" != "*.deb" ]; then
        DEB_LINK="{\"name\":\"$DEB\",\"url\":\"$PKG_URL/$DEB\",\"link_type\":\"package\"}"
        release-cli create \
          --name "LogLens $CI_COMMIT_TAG" \
          --tag-name "$CI_COMMIT_TAG" \
          --description "See [CHANGELOG.md](CHANGELOG.md) for details." \
          --assets-link "$TARBALL_LINK" \
          --assets-link "$DEB_LINK"
      else
        release-cli create \
          --name "LogLens $CI_COMMIT_TAG" \
          --tag-name "$CI_COMMIT_TAG" \
          --description "See [CHANGELOG.md](CHANGELOG.md) for details." \
          --assets-link "$TARBALL_LINK"
      fi
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/'
