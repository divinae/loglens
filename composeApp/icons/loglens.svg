<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3C3F41"/>
      <stop offset="1" stop-color="#2B2D30"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4DB6E2"/>
      <stop offset="1" stop-color="#3592FF"/>
    </linearGradient>
  </defs>

  <!-- rounded app surface -->
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>

  <!-- log lines: level dot + text bar -->
  <g>
    <!-- info -->
    <circle cx="232" cy="300" r="26" fill="#7AB97A"/>
    <rect x="288" y="282" width="372" height="36" rx="18" fill="#A9B7C6"/>
    <!-- warning -->
    <circle cx="232" cy="404" r="26" fill="#E0B341"/>
    <rect x="288" y="386" width="468" height="36" rx="18" fill="#A9B7C6"/>
    <!-- error (highlighted row) -->
    <rect x="180" y="476" width="600" height="72" rx="20" fill="#46322F"/>
    <circle cx="232" cy="512" r="26" fill="#E26A6A"/>
    <rect x="288" y="494" width="420" height="36" rx="18" fill="#E0A0A0"/>
    <!-- debug -->
    <circle cx="232" cy="616" r="26" fill="#6897BB"/>
    <rect x="288" y="598" width="316" height="36" rx="18" fill="#8C9AAB"/>
  </g>

  <!-- magnifier -->
  <g>
    <circle cx="660" cy="650" r="150" fill="none" stroke="url(#glass)" stroke-width="48"/>
    <circle cx="660" cy="650" r="118" fill="#3592FF" fill-opacity="0.12"/>
    <rect x="752" y="742" width="190" height="64" rx="32" transform="rotate(45 752 742)" fill="url(#glass)"/>
  </g>
</svg>
