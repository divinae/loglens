# On a tag like v1.3.2: the Linux .deb and a portable app image (.tar.gz), attached to a GitHub
# Release for the tag. macOS (.dmg) and Windows (.msi) are built on their own platforms and
# attached by hand (see RELEASE.md): jpackage only targets the OS it runs on.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: write

jobs:
  release-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      # .deb packaging needs dpkg and fakeroot
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq fakeroot dpkg
      - name: Build
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          ./gradlew --no-daemon -PappVersion=$VERSION :composeApp:packageDeb :composeApp:createDistributable
          mkdir -p dist
          cp composeApp/build/compose/binaries/main/deb/*.deb dist/
          tar -C composeApp/build/compose/binaries/main/app -czf "dist/loglens-$GITHUB_REF_NAME-linux-x64.tar.gz" loglens
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --title "LogLens $GITHUB_REF_NAME" \
            --notes "See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/$GITHUB_REF_NAME/CHANGELOG.md) for details."
