# CI for LogLens: the tests, detekt and a packaging smoke test on every push and pull request.
# Gradle itself must run on JDK 21 (a newer JDK breaks the build); the Kotlin/Compose toolchain
# then provisions JetBrains Runtime 25 through the foojay resolver for compile/run/package.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      # createDistributable smoke-tests jlink/jpackage on every build; the app image itself is
      # only published by the release workflow
      - run: ./gradlew --no-daemon :composeApp:jvmTest detekt :composeApp:createDistributable
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: composeApp/build/test-results/jvmTest/*.xml
          if-no-files-found: ignore
